<style>
:root{
  --bg:#f4eeff; --surface:#ffffff; --surface2:#ece3ff; --line:#d9cbf5; --text:#22103f; --muted:#6c5a93; --accent:#6a45d8; --deep:#b77a00;
  --salon:#d42a5f; --mutfak:#00879e; --yemek:#cc4f2a; --giris:#7a2fd6; --wc:#3c5bd6; --yatak:#b6239f; --cocuk:#bd6500;
  --misafir:#008a56; --ofis:#cf1f1f; --arabanyo:#1f6fd1; --banyo:#8a7800; --bahce:#2e8f1e; --ara:#1f6fd1; --balkon:#0f8a8a; --kapi:#a0522d;
  --ga:22%; --gb:10%;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#110822; --surface:#1d1036; --surface2:#28184a; --line:#3b2a66; --text:#fbf6ff; --muted:#b2a3da; --accent:#ae92ff; --deep:#ffd43f;
    --salon:#ff5c8a; --mutfak:#4ff3ff; --yemek:#ff9a7a; --giris:#c07bff; --wc:#8fa8ff; --yatak:#ff7bf0; --cocuk:#ffb43d;
    --misafir:#3dffa2; --ofis:#ff4d4d; --arabanyo:#5ab8ff; --banyo:#f5ff5a; --bahce:#8dff6a; --ara:#5ab8ff; --balkon:#5cf0d0; --kapi:#ffa07a;
    --ga:75%; --gb:40%; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#110822; --surface:#1d1036; --surface2:#28184a; --line:#3b2a66; --text:#fbf6ff; --muted:#b2a3da; --accent:#ae92ff; --deep:#ffd43f;
  --salon:#ff5c8a; --mutfak:#4ff3ff; --yemek:#ff9a7a; --giris:#c07bff; --wc:#8fa8ff; --yatak:#ff7bf0; --cocuk:#ffb43d;
  --misafir:#3dffa2; --ofis:#ff4d4d; --arabanyo:#5ab8ff; --banyo:#f5ff5a; --bahce:#8dff6a; --ara:#5ab8ff; --balkon:#5cf0d0; --kapi:#ffa07a;
  --ga:75%; --gb:40%; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{touch-action:manipulation;height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"Baloo 2",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 60px}
.glow{color:var(--c);text-shadow:0 0 10px color-mix(in srgb,var(--c) var(--ga),transparent),0 0 30px color-mix(in srgb,var(--c) var(--gb),transparent)}

.top{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.nav{width:46px;height:46px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--surface2);font-size:1.5rem;line-height:1}
.wk{flex:1;text-align:center;border:0;background:transparent;padding:0}
.wk-n::after{content:" ▾";font-size:.5em;vertical-align:middle;opacity:.7}
.nav:disabled{opacity:.3;cursor:default}
.picker{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;max-height:55vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.picker button.cur{border:2px solid var(--deep)}
.picker[hidden]{display:none}
.now[hidden],.editw[hidden]{display:none}
.picker button{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 0;font-weight:800;font-size:1.15rem}
.picker button small{display:block;font-size:.78rem;font-weight:600;opacity:.75;line-height:1.1}
.picker button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.wk-n{font-size:clamp(2rem,9vw,2.8rem);font-weight:800;line-height:1;--c:var(--accent)}
.wk-d{color:var(--muted);font-weight:600;font-size:1.05rem}
.actions{display:flex;gap:8px;justify-content:center;margin:0 0 14px}
.actions .editw{margin:0;padding:6px 14px}
.actions .now{padding:6px 14px}
.now{border:2px solid var(--accent);background:var(--accent);color:var(--bg);border-radius:14px;padding:6px 22px;font-weight:800;font-size:1.05rem}
.now.here{background:transparent;color:var(--muted);border-color:var(--line)}

.days.swl{animation:swl .22s ease}.days.swr{animation:swr .22s ease}
@keyframes swl{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes swr{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.days.swl,.days.swr{animation:none}}
.days{display:flex;flex-direction:column;gap:10px}
.day{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px 12px 12px 10px}
.day.today{border:2px solid var(--accent);box-shadow:0 0 22px color-mix(in srgb,var(--accent) var(--gb),transparent)}
.day.deep{border:3px solid var(--deep);box-shadow:0 0 24px color-mix(in srgb,var(--deep) var(--gb),transparent)}
.dname{font-size:1.25rem;font-weight:800;line-height:1}
.ddate{font-size:.9rem;color:var(--muted);font-weight:600}
.today .dname{color:var(--accent)}
.rooms{min-width:0}
.rn{font-size:clamp(1.7rem,8.2vw,2.9rem);font-weight:800;line-height:1.02;overflow-wrap:anywhere}
.none{font-size:1.3rem;color:var(--muted);font-weight:600}
.deeptag{display:inline-block;font-size:clamp(1rem,4.6vw,1.35rem);font-weight:800;margin-bottom:2px}
.shimmer{background:linear-gradient(100deg,var(--deep) 30%,#fff7c2 50%,var(--deep) 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 3.2s linear infinite;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--deep) var(--gb),transparent))}
@keyframes sh{from{background-position:100% 0}to{background-position:-150% 0}}
@media (prefers-reduced-motion:reduce){.shimmer{animation:none;color:var(--deep);background:none}}
.vac{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:84px;padding:6px 8px;border-radius:16px;text-align:center;font-weight:800;font-size:.95rem;line-height:1.1;border:2px solid var(--accent);color:var(--accent)}
.vac .ic{display:flex;align-items:flex-end;gap:2px}
.vac svg{display:block}
.vac.all{background:var(--accent);color:var(--bg);box-shadow:0 0 16px color-mix(in srgb,var(--accent) var(--ga),transparent)}
.vac.no{border:2px dashed var(--line);color:var(--muted);font-weight:600}
.vac.no svg{opacity:.4}
.note{font-size:.95rem;color:var(--muted);margin:16px 4px 0;text-align:center}
.legend{margin-top:18px;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;align-items:center;color:var(--muted);font-size:.92rem}
.legend span{display:inline-flex;align-items:center;gap:4px}
.editw{display:block;margin:0 auto 12px;border:2px solid var(--accent);background:transparent;color:var(--accent);border-radius:14px;padding:6px 22px;font-weight:800;font-size:1.05rem}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.3);max-height:82vh;overflow-y:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet-in{max-width:760px;margin:0 auto}
.sh-head{display:flex;align-items:center;gap:8px}
.sh-title{flex:1;font-size:1.3rem;font-weight:800;text-align:center;line-height:1.1}
.sh-title small{display:block;font-size:.9rem;color:var(--muted);font-weight:600}
.dsec{margin-top:16px;padding:12px;border:1px solid var(--line);border-radius:20px;background:var(--bg)}
.dsec.deep{border:2px solid var(--deep)}
.dsec-h{display:flex;align-items:baseline;gap:8px;font-size:1.3rem}
.dsec-h span{color:var(--muted);font-weight:600;font-size:1rem;flex:1}
.mini{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:2px 10px;font-size:.9rem;font-weight:600}
.dsec .deep-toggle{font-size:1.1rem;padding:8px;margin-top:12px}
.donebar{position:sticky;bottom:0;background:var(--surface);padding-top:10px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.tab{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:8px 0;font-weight:700;line-height:1.05}
.tab small{display:block;font-size:.8rem;font-weight:600;opacity:.8}
.tab.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.status{text-align:center;font-size:.9rem;color:var(--muted);min-height:1.3em;margin-top:6px}
.grp{margin-top:12px}
.grp-h{font-size:1rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--c);background:transparent;color:var(--text);border-radius:14px;padding:8px 14px;font-weight:700;font-size:1.05rem;min-height:46px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--c);color:var(--bg);box-shadow:0 0 14px color-mix(in srgb,var(--c) var(--gb),transparent)}
.deep-toggle{width:100%;margin-top:16px;border:3px solid var(--deep);background:transparent;color:var(--deep);border-radius:18px;padding:12px;font-size:1.3rem;font-weight:800}
.deep-toggle.on{background:var(--deep);color:#2a1a00;box-shadow:0 0 24px color-mix(in srgb,var(--deep) var(--ga),transparent)}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;min-width:130px;border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:10px 12px;font-weight:700}
.done{background:var(--accent);color:var(--bg);border:0}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:700;font-size:1.05rem;padding:6px 0}
.set{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0}
.set input,.pw input{font:inherit;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--text)}
.pw{display:flex;flex-direction:column;gap:10px;padding:10px 0}
.pw input{font-size:1.15rem}
.err{color:var(--ofis);font-weight:700;min-height:1.2em}
</style>
</head>

<div class="wrap">

  <div class="actions"><button class="now" id="nowBtn">Bu hafta</button>

</div>

<div class="sheet" id="sheet" role="dialog" aria-label="Haftayı düzenle">

e},{"rooms":["mutfak"],"vac":"","deep":false},{"rooms":["giris","wc"],"vac":"","deep":false},{"rooms":["salon"],"vac":"all","deep":false},{"rooms":["bahce","balkon"],"vac":"","deep":true}]},"w10":{"days":[{"rooms":["ara","banyo"],"vac":"all","deep":false},{"rooms":["ofis"],"vac":"","deep":true},{"rooms":["wc","yatak"],"vac":"","deep":false},{"rooms":["misafir"],"vac":"down","deep":false},{"rooms":["yemek"],"vac":"up","deep":false}]},"w11":{"days":[{"rooms":["salon"],"vac":"all","deep":false},{"rooms":["giris","wc"],"vac":"","deep":false},{"rooms":[],"vac":"","deep":false},{"rooms":["cocuk"],"vac":"down","deep":false},{"rooms":["mutfak"],"vac":"up","deep":false}]},"w12":{"days":[{"rooms":["yatak"],"vac":"all","deep":false},{"rooms":["ofis"],"vac":"","deep":false},{"rooms":["yemek","wc"],"vac":"","deep":false},{"rooms":["banyo"],"vac":"all","deep":false},{"rooms":["misafir"],"vac":"","deep":true}]},"w13":{"days":[{"rooms":["mutfak"],"vac":"all","deep":false},{"rooms":[],"vac":"","deep":false},{"rooms":["giris","wc"],"vac":"","deep":true},{"rooms":["cocuk"],"vac":"up","deep":false},{"rooms":["salon"],"vac":"down","deep":false}]},"w14":{"days":[{"rooms":["bahce","balkon"],"vac":"all","deep":false},{"rooms":["ara","banyo"],"vac":"","deep":true},{"rooms":["yatak"],"vac":"","deep":false},{"rooms":["wc","ofis"],"vac":"down","deep":false},{"rooms":["yemek"],"vac":"up","deep":false}]},"w15":{"days":[{"rooms":["salon"],"vac":"all","deep":false},{"rooms":["mutfak"],"vac":"","deep":false},{"rooms":["giris","wc"],"vac":"down","deep":false},{"rooms":["cocuk","misafir","ofis","banyo"],"vac":"up","deep":true},{"rooms":[],"vac":"","deep":false}]},"w16":{"days":[{"rooms":["cocuk","misafir"],"vac":"all","deep":false},{"rooms":["yemek"],"vac":"","deep":false},{"rooms":["ofis"],"vac":"","deep":false},{"rooms":[],"vac":"","deep":false},{"rooms":["banyo","wc"],"vac":"all","deep":false}]}};

/* ================================================================================================ */
const ROOMS=[
 {k:'salon',n:'Salon',f:'down'},{k:'mutfak',n:'Mutfak',f:'down'},{k:'yemek',n:'Yemek',f:'down'},{k:'giris',n:'Giriş',f:'down'},{k:'wc',n:'WC',f:'down'},
 {k:'yatak',n:'Yatak',f:'up'},{k:'cocuk',n:'Çocuk',f:'up'},{k:'misafir',n:'Misafir',f:'up'},{k:'ofis',n:'Ofis',f:'up'},{k:'ara',n:'Ara',f:'up'},{k:'banyo',n:'Banyo',f:'up'},

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dateOf=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};

const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7))};

/* cordless stick vacuum + house with floors */

<path d="M33 5h6a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-2"/><rect x="27" y="7" width="7" height="15" rx="3.5" fill="currentColor" fill-opacity=".3"/>

<path d="M29 22 13 40"/><rect x="4" y="39" width="17" height="6" rx="3" fill="currentColor" fill-opacity=".3"/></svg>`;

 ? `<svg width="${s}" height="${s}" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M3 14 16 3l13 11"/><path d="M6 12v16h20V12" fill="currentColor"/></svg>`

const now=new Date(), todayKey=keyOf(now);
const startMon=()=>cfg.start?mondayOf(dateOf(cfg.start)):null;
const homeMonday=()=>{let m=mondayOf(now);if(now.getDay()===0)m=addDays(m,7);const s=startMon();return s&&m<s?s:m};
const canBack=()=>{const s=startMon();return !s||monday>s};
function goWeek(n){const s=startMon();if(!s)return;monday=addDays(s,(n-1)*7);$('picker').hidden=true;render()}

function weekIdx(mon){
  if(!cfg.start) return null;
  const s=mondayOf(dateOf(cfg.start)), w=Math.round((mon-s)/(7*864e5));
  return w<0?null:w+1;
}
const wid=n=>'w'+pad(n);
function dayPlan(n,i){const w=weeks[wid(n)];return (w&&w.days&&w.days[i])||{rooms:[],vac:'',deep:false}}

$('legend').innerHTML=`<span style="color:var(--accent)">${VACSVG(22)}${HOUSE('up',18)}Üst kat</span><span style="color:var(--accent)">${VACSVG(22)}${HOUSE('down',18)}Alt kat</span><span style="color:var(--accent)">${VACSVG(22)}${HOUSE('all',18)}Bütün ev</span><span class="shimmer">✦ Derin temizlik</span>`;

function render(){
  const n=weekIdx(monday), fri=addDays(monday,4);
  $('wkN').textContent=n?n+'. hafta':'Plan';
  $('wkD').textContent=monday.getMonth()===fri.getMonth()
    ? `${monday.getDate()}–${fri.getDate()} ${MONTHS[fri.getMonth()]}`
    : `${monday.getDate()} ${MONTHS[monday.getMonth()]} – ${fri.getDate()} ${MONTHS[fri.getMonth()]}`;

      <div class="rooms">${p.deep?'<div class="deeptag shimmer">✦ Derin temizlik</div>':''}
        ${rooms.length?rooms.map(r=>`<div class="rn glow" style="--c:var(--${r})">${esc(roomBy[r].n)}</div>`).join(''):`<div class="none">${loaded?(db?'Temizlik yok':'—'):'Yükleniyor…'}</div>`}</div>

$('prevW').onclick=()=>{if(!canBack())return;monday=addDays(monday,-7);render()};

function renderSheet(){
  if(!editing) return;

      h+='</div></div>';
    }
    h+=`<div class="grp"><div class="grp-h">Süpürge</div><div class="chips">`;
    h+=[['up','Üst kat'],['down','Alt kat'],['all','Bütün ev']].map(([v,l])=>{const on=(p.vac||'')===v;return `<button class="chip${on?' on':''}" style="--c:var(--accent)" data-d="${i}" data-vac="${v}" aria-pressed="${on}">${HOUSE(v,20)}${l}</button>`}).join('');
    h+='</div></div>';
    h+=`<button class="deep-toggle${p.deep?' on':''}" data-d="${i}" data-act="deep" aria-pressed="${!!p.deep}">✦ Derin temizlik ${p.deep?'işaretli':'olarak işaretle'}</button></section>`;
  }
  h+=`<details id="setD"><summary>Plan ayarları</summary><div class="set"><span>1. haftanın pazartesisi</span><input type="date" id="startIn" value="${cfg.start||''}"></div></details>`;
  h+=`<div class="row donebar"><button class="btn done" id="close">Bitti</button></div>`;
  const wasOpen=$('setD')?.open, st=$('status')?.textContent||'';
  $('sheetIn').innerHTML=h;
  if(wasOpen) $('setD').open=true;
  $('status').textContent=st;
}
function closeSheet(){editing=null;$('sheet').classList.remove('open')}
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function tryPw(){
  const v=$('pwIn').value;
  if(await sha(v)===PW_HASH){unlocked=true;try{sessionStorage.setItem('tmz-ok','1')}catch(e){};renderSheet()}
  else{$('pwErr').textContent='Şifre yanlış';$('pwIn').select()}
}
$('sheetIn').onkeydown=e=>{if(e.target.id==='pwIn'&&e.key==='Enter') tryPw()};
$('sheetIn').onclick=e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.id==='close') return closeSheet();
  if(t.id==='pwOk') return tryPw();
  if(t.id==='sPrev'){if(canBack())monday=addDays(monday,-7);return render()}
  if(t.id==='sNext'){monday=addDays(monday,7);return render()}
  const di=+t.dataset.d;
  if(t.dataset.room) edit(di,p=>{const k=t.dataset.room;p.rooms=p.rooms.includes(k)?p.rooms.filter(x=>x!==k):[...p.rooms,k]});
  else if(t.dataset.vac) edit(di,p=>{p.vac=p.vac===t.dataset.vac?'':t.dataset.vac});
  else if(t.dataset.act==='deep') edit(di,p=>{p.deep=!p.deep});
  else if(t.dataset.act==='clear') edit(di,p=>{p.rooms=[];p.vac='';p.deep=false});
};
$('sheetIn').onchange=async e=>{
  if(e.target.id==='startIn'&&e.target.value){
    const s=keyOf(mondayOf(dateOf(e.target.value)));
    try{await db.ref(ROOT+'/config/start').set(s);cfg={...cfg,start:s};monday=homeMonday();setStatus('Başlangıç kaydedildi ✓');render()}
    catch(err){setStatus('Kaydedilemedi')}
  }
};
function edit(di,fn){
  const n=weekIdx(monday), id=wid(n);
  const w=JSON.parse(JSON.stringify(weeks[id]||{days:[]}));
  for(let j=0;j<5;j++) w.days[j]=w.days[j]||{rooms:[],vac:'',deep:false};
  const p=w.days[di]; p.rooms=p.rooms||[]; fn(p);
  p.rooms=ORDER.filter(k=>p.rooms.includes(k));
  weeks[id]=w; dirty.add(id); render(); queueSave(id);
}
function setStatus(s){const el=$('status'); if(el) el.textContent=s}
function queueSave(id){setStatus('Kaydediliyor…');clearTimeout(timers[id]);timers[id]=setTimeout(()=>flush(id),450)}
async function flush(id){
  if(running[id]){again[id]=true;return}
  running[id]=true;
  try{await db.ref(ROOT+'/weeks/'+id).set(weeks[id]);setStatus('Kaydedildi ✓')}
  catch(err){setStatus(String(err&&err.code||'').includes('PERMISSION')?'Kaydedilemedi: veritabanı izin vermiyor':'Kaydedilemedi, tekrar dokun')}
  running[id]=false;
  if(again[id]){again[id]=false;flush(id)} else dirty.delete(id);
}

render();
(async()=>{
  try{
    firebase.initializeApp(firebaseConfig);
    const tmo=(p,ms,what)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(what+' zaman aşımı')),ms))]);
    await tmo(firebase.auth().signInAnonymously(),8000,'Giriş').catch(e=>{console.warn('auth',e);authErr=e});
    const rdb=firebase.database();
    const root=rdb.ref(ROOT);
    const first=await tmo(root.once('value'),12000,'Veritabanı');
    if(!first.exists()) await root.set({weeks:SEED_WEEKS,config:SEED_CONFIG});
    db={ref:p=>rdb.ref(p)};
    rdb.ref(ROOT+'/config').on('value',s=>{const v=s.val();if(v){cfg={cycle:16,...v};const st=startMon();if(st&&monday<st)monday=homeMonday()} render()});
    rdb.ref(ROOT+'/weeks').on('value',s=>{
      const next=s.val()||{};
      for(const id of dirty) next[id]=weeks[id];
      weeks=next; loaded=true; render();
    },()=>{loaded=true;render()});
  }catch(e){console.error(e);db=null;loaded=true;loadErr=(authErr?'Giriş: '+(authErr.code||authErr.message)+' · ':'')+(e.code||e.message);render()}
})();
</script>
</body>
</html>
