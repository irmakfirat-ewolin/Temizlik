  :root:not([data-theme="light"]){
    --bg:#110822; --surface:#1d1036; --surface2:#28184a; --line:#3b2a66; --text:#fbf6ff; --muted:#b2a3da; --accent:#ae92ff; --deep:#ffd43f; --fx:100%; --on:#160a2b; --pulse-to:#fff; --c-hol:#2ee6d6; --c-sick:#b8e986; --c-nt:#b9a8ff; --c-red:#ff5d6c; --c-gold:#ffd84d;

*,*::before,*::after{box-sizing:inherit}
html{touch-action:manipulation;height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"Baloo 2",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 60px}
.glow{color:var(--c);text-shadow:0 0 10px color-mix(in srgb,var(--c) var(--ga),transparent),0 0 30px color-mix(in srgb,var(--c) var(--gb),transparent)}

.top{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.nav{width:46px;height:46px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--surface2);font-size:1.5rem;line-height:1}
.wk{flex:1;text-align:center;border:0;background:transparent;padding:0}
.wk-n::after{content:" ▾";font-size:.5em;vertical-align:middle;opacity:.7}
.nav:disabled{opacity:.3;cursor:default}
.picker{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;max-height:55vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.picker button.cur{border:2px solid var(--deep)}
.picker[hidden]{display:none}
.now[hidden],.editw[hidden]{display:none}
.picker button{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 0;font-weight:800;font-size:1.15rem}
.picker button small{display:block;font-size:.78rem;font-weight:600;opacity:.75;line-height:1.1}

function render(){

  $('wkN').textContent=n?n+'. hafta':'Plan';
  $('wkD').textContent=monday.getMonth()===fri.getMonth()
    ? `${monday.getDate()}–${fri.getDate()} ${MONTHS[fri.getMonth()]}`
    : `${monday.getDate()} ${MONTHS[monday.getMonth()]} – ${fri.getDate()} ${MONTHS[fri.getMonth()]}`;
  $('nowBtn').classList.toggle('here',keyOf(monday)===keyOf(homeMonday()));
  $('prevW').disabled=!canBack();
  $('editW').hidden=!(db&&n);$('cartBtn').hidden=!db;
  const before=cfg.start&&monday<mondayOf(dateOf(cfg.start));
  let h='';
  for(let i=0;i<5;i++){
    const d=addDays(monday,i), k=keyOf(d), p=n?dayPlan(n,i):{rooms:[]}, today=k===todayKey;
    const rooms=ORDER.filter(r=>(p.rooms||[]).includes(r));
    const canCk=db&&k<=todayKey&&!offOf(p), dn=key=>isDone(k,key);
    const items=[...rooms.map(r=>'r_'+r),...(p.vac?['vac']:[]),...fOf(p).map(f=>'f_'+f)];
    const allDone=canCk&&items.length&&items.every(dn);
    const ckB=(key,lbl,cls='')=>canCk?`<button class="ck${cls}${dn(key)?' on':''}" data-done="${k}|${key}" aria-label="${esc(lbl)}" aria-pressed="${dn(key)}">✓</button>`:'';
    h+=`<div class="day${allDone?' alldone':''}${p.hol?' hol':''}${p.sick?' sick':''}${today?' today':''}${k===hlKey()?' hl':''}${k<todayKey&&k!==hlKey()?' past':''}${p.deep?' deep':''}">
      <div><div class="dname">${DN[i]}</div><div class="ddate">${pad(d.getDate())}.${pad(d.getMonth()+1)}</div></div>
      <div class="rooms">${p.deep?'<div class="deeptag shimmer" data-tip="✦ Derin temizlik\nO gün sadece bu oda, detaylı temizlenir">✦ Derin temizlik</div>':''}
        ${rooms.length?rooms.map(r=>`<div class="rrow${canCk&&dn('r_'+r)?' dn':''}">${ckB('r_'+r,roomBy[r].n)}<button class="rn glow" style="--c:${col(r)}" data-room="${r}">${esc(roomBy[r].n)}</button></div>`).join(''):(p.hol?'<div class="holtag">🏖️ Tatil</div>':p.sick?'<div class="sicktag">🤒 Hasta</div>':(p.vac||fOf(p).length?'':`<div class="none">${loaded?(db?'Temizlik yok':'—'):'Yükleniyor…'}</div>`))}</div>
      ${db?postit('day',k):'<div></div>'}
      ${p.vac||fOf(p).length?`<div class="vcol">${p.vac?`<div class="vac ${p.vac==='all'?'all':''}${canCk&&dn('vac')?' dn':''}" data-tip="Süpürge – ${VAC[p.vac]}">${ckB('vac','Süpürge – '+VAC[p.vac],' ckb')}<span class="ic" role="img" aria-label="Süpürge: ${VAC[p.vac]}">${VACSVG(36)}${HOUSE(p.vac,32)}</span></div>`:''}${fOf(p).length?`<div class="fgrid">${fOf(p).map(f=>`<div class="fbox${canCk&&dn('f_'+f)?' dn':''}" style="--fc:${FLAGS[f].c}" role="img" aria-label="${FLAGS[f].lg}" data-tip="${FLAGS[f].lg}">${ckB('f_'+f,FLAGS[f].lg,' ckb')}${FLAGS[f].ic(26)}</div>`).join('')}</div>`:''}</div>`
             :'<div></div>'}
      ${taskBox('day',k)}
    </div>`;
  }
  const drawDays=()=>{const kp=keepInputs($('days'));$('days').innerHTML=h;restoreInputs($('days'),kp);fitRooms()};
  const wtH=db?`<div class="wtasks"><div class="wtrow">${taskBox('week',keyOf(monday))}${postit('week',keyOf(monday))}</div></div><div class="sep" aria-hidden="true"></div>`:'';
  const drawWT=()=>{const kp=keepInputs($('wtasks'));$('wtasks').innerHTML=wtH;restoreInputs($('wtasks'),kp)};
  if(forceMain){drawDays();drawWT()}else{safeR($('days'),'days',drawDays);safeR($('wtasks'),'wt',drawWT)}
  $('catList').innerHTML=cats().map(c=>`<option value="${esc(c)}">`).join('');

  renderShop();
  safeR($('sheetIn'),'sheet',renderSheet);
}

const dnum=d=>Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(2000,0,1))/864e5);
function planEvents(){
  const s=startMon(); if(!s) return [];
  const ev=[];
  for(const[id,w] of Object.entries(weeks)){
    const n=parseInt(id.slice(1),10); if(!n||!w||!w.days) continue;
    for(const[i,d] of Object.entries(w.days)){ if(!d||+i>4) continue;
      const date=addDays(s,(n-1)*7+(+i)); ev.push({n,t:dnum(date),date,dk:keyOf(date),done:doneMap[keyOf(date)]||{},rooms:d.rooms||[],deep:!!d.deep,vac:d.vac||'',...Object.fromEntries(FKEYS.map(f=>[f,!!d[f]]))}); }
  }
  return ev.sort((a,b)=>a.t-b.t);
}

function renderNotePop(){if(!noteCtx)return;const {g,key}=noteCtx,v=noteOf(g,key);
  $('notePop').innerHTML=`<div class="np-h"><b>${esc(noteTitle(g,key))}</b>${!noteEditing&&v?'<button class="np-ic" id="npEdit" aria-label="Düzenle">✏️</button>':''}<button class="np-ic" id="npClose" aria-label="Kapat">✕</button></div>`+
  (noteEditing?`<textarea class="np-ta" id="npTa" placeholder="Not yaz… örn. camları sil, deterjan al, süpürgeyi temizle">${esc(v)}</textarea>
    <div class="row" style="margin-top:12px">${v?'<button class="btn" id="npDel">🗑 Sil</button>':''}<button class="btn done" id="npSave">Kaydet</button></div>`
   :v?`<div class="np-paper">${esc(v)}</div>`:'<div class="np-hint">Not yok</div>')}
function storeNote(g,key,v){const old=noteOf(g,key);v=(v||'').replace(/\s+$/,'');if(v===old)return;(notes[g]=notes[g]||{})[key]=v;db.ref(`${ROOT}/notes/${g}/${key}`).set(v||null).catch(()=>alert('Kaydedilemedi'));
  const t=noteTitle(g,key).replace('📌 ','');undoPush(v?(old?`Not değişti: ${t}`:`Not eklendi: ${t}`):`Not silindi: ${t}`,()=>{(notes[g]=notes[g]||{})[key]=old;db.ref(`${ROOT}/notes/${g}/${key}`).set(old||null).catch(()=>{});renderNow();if(noteCtx)renderNotePop()});renderNow()}
function closeNote(){if(noteEditing&&noteCtx&&$('npTa'))storeNote(noteCtx.g,noteCtx.key,$('npTa').value);noteCtx=null;noteEditing=false;$('noteBg').hidden=true;$('notePop').hidden=true}
$('noteBg').onclick=closeNote;
$('notePop').onclick=e=>{const t=e.target.closest('button');if(!t||!noteCtx)return;const {g,key}=noteCtx;
  if(t.id==='npClose')return closeNote();
  if(t.id==='npEdit'){noteEditing=true;renderNotePop();const x=$('npTa');if(x){x.focus();try{x.setSelectionRange(x.value.length,x.value.length)}catch(_){}}return}
  if(t.id==='npSave'){storeNote(g,key,$('npTa').value);noteEditing=false;if(!noteOf(g,key))return closeNote();renderNotePop();return}
  if(t.id==='npDel'){storeNote(g,key,'');noteEditing=false;closeNote()}};
function saveNote(g,key,v){v=(v||'').replace(/\s+$/,'');(notes[g]=notes[g]||{})[key]=v;clearTimeout(noteTimers[g+key]);noteTimers[g+key]=setTimeout(()=>db.ref(`${ROOT}/notes/${g}/${key}`).set(v||null).catch(()=>{}),500)}
const DEF_CATS=['Alışveriş','Bulaşık makinesi','Çöpler','Genel'];
function cats(){const s=new Set(DEF_CATS);for(const g of ['day','week'])for(const v of Object.values(tasks[g]||{}))for(const t of Object.values(v||{}))if(t&&t.c)s.add(t.c);return [...s]}
function catColor(c){let h=0;for(const ch of String(c))h=(h*31+ch.charCodeAt(0))>>>0;return `var(--p${[9,6,7,15,1,16,14,17,0,12][h%10]})`}
const taskList=(g,key)=>Object.entries((tasks[g]||{})[key]||{}).filter(([id,v])=>v).map(([id,v])=>({id,...v})).sort((a,b)=>(a.o||0)-(b.o||0));
const tOpen={}, taskPhoto={}, tAdd={};
const QUICK=[['Bulaşık makinesi','🍽'],['Çöpler','🗑'],['Çamaşır yıkama','🧺'],['Posta','📮'],['Pfand','♻️','week']];
const SUBS={'Çamaşır yıkama':[['Beyaz','⚪'],['Renkli','🌈'],['Siyah','⚫']],'Posta':[['Gönder','📤'],['Teslim al','📥'],['İkisi','🔁']]};
const lOpen={};
function isOpen(g,key){const id=g+key;if(id in tOpen)return tOpen[id];const L=taskList(g,key);return L.some(t=>!t.d)&&(g==='week'||key===todayKey)}
function taskBox(g,key){
  if(!db) return '';
  const L=taskList(g,key), dn=L.filter(t=>t.d).length, open=isOpen(g,key), pre=`${g}-${key}`;
  let h=`<div class="tkbox"><button class="tkh" data-ttoggle="${g}|${key}" aria-expanded="${open}"><span class="tkl">${g==='week'?'📋 Bu hafta yapılacaklar':'📝 Görevler'}</span>
    ${L.length-dn?`<span class="tkn pulse">${L.length-dn}</span>`:L.length?'<span class="tkn all">✓</span>':''}<span class="chev">${open?'▴':'▾'}</span></button>`;
  if(open){
    h+=`<div class="tkbody">${L.map(t=>`<div class="tkr${t.d?' ok':''}" style="--tc:${catColor(t.c||'Genel')}"><button class="cb" data-tk="${g}|${key}|${t.id}" aria-label="Yapıldı">✓</button>
      ${t.t?`<span class="tc">${esc(t.c||'Genel')}</span>`:'<span></span>'}<input class="tin${t.t?'':' qn'}" placeholder="${t.t?'…':esc(t.c||'Genel')}" value="${esc(t.t||'')}" data-tedit="${g}|${key}|${t.id}" data-keep="te-${t.id}" maxlength="120" aria-label="Görev">
      ${t.p?`<button class="sph" data-tview="${t.p}" aria-label="Fotoğraf">📷</button>`:''}<button class="x" data-tdel="${g}|${key}|${t.id}" aria-label="Sil">✕</button></div>`).join('')||'<div class="tkempty">Görev yok.</div>'}
      <button class="tkplus${tAdd[pre]?' on':''}" data-taddopen="${pre}">${tAdd[pre]?'✕ Kapat':'＋ Görev ekle'}</button>
      ${tAdd[pre]?`<div class="quick">${QUICK.filter(q=>!q[2]||q[2]===g).map(([n,ic])=>SUBS[n]
        ?`<button class="qk${lOpen[pre]===n?' on':''}" style="--tc:${catColor(n)}" data-tsubopen="${pre}|${n}">${ic} ${n} ${lOpen[pre]===n?'▴':'▾'}</button>`
        :`<button class="qk" style="--tc:${catColor(n)}" data-tquick="${g}|${key}|${n}">${ic} ${n}</button>`).join('')}</div>
      ${SUBS[lOpen[pre]]?`<div class="quick sub">${SUBS[lOpen[pre]].map(([n,ic])=>`<button class="qk" style="--tc:${catColor(lOpen[pre])}" data-tlsub="${g}|${key}|${lOpen[pre]}|${n}">${ic} ${n}</button>`).join('')}</div>`:''}
      <div class="tkform"><input placeholder="Ad, örn. Bavullar" data-keep="newc-${pre}" id="tc-${pre}" maxlength="30"><input placeholder="Ne yapılacak?" data-keep="newt-${pre}" id="tt-${pre}" maxlength="120" enterkeyhint="done">
      <label class="sphoto tph${taskPhoto[pre]?' has':''}" aria-label="Fotoğraf ekle">📷<input type="file" accept="image/*" data-tphoto="${pre}"></label>
      <button class="btn done" data-tadd="${g}|${key}" style="min-width:0;padding:8px 14px">+</button></div>`:''}</div>`;
  }
  return h+`</div>`;
}
function showPhoto(p){const show=v=>{$('imgViewImg').src=v;$('imgView').hidden=false};if(photoCache[p])show(photoCache[p]);else db.ref(ROOT+'/photos/'+p).once('value').then(s=>{const v=s.val();if(v){photoCache[p]=v;show(v)}})}
function setTaskDone(g,key,id,v){const t=((tasks[g]||{})[key]||{})[id];if(!t||!db)return;t.d=v;renderNow();db.ref(`${ROOT}/tasks/${g}/${key}/${id}`).update({d:v}).catch(()=>{})}
function toggleTask(ref){const [g,key,id]=ref.split('|');const t=((tasks[g]||{})[key]||{})[id];if(!t||!db)return;
  const v=!t.d;setTaskDone(g,key,id,v);const nm=(t.c||'Genel')+(t.t?' – '+t.t:'');
  undoPush(v?`✓ Yapıldı: ${nm}`:`Tekrar açıldı: ${nm}`,()=>setTaskDone(g,key,id,!v))}
async function addTask(g,key,quick,sub){const pre=`${g}-${key}`,ci=$('tc-'+pre),ti=$('tt-'+pre);
  let c,t;if(quick){c=quick;t=sub||''}else{t=(ti.value||'').trim();c=(ci.value||'').trim();if(!t&&!c){ci.focus();return}if(!c)c='Genel';ti.value='';ci.value=''}
  let p='';if(taskPhoto[pre]){p='ph'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);photoCache[p]=taskPhoto[pre];db.ref(ROOT+'/photos/'+p).set(taskPhoto[pre]).catch(()=>{});delete taskPhoto[pre]}
  db.ref(`${ROOT}/tasks/${g}/${key}`).push().set({c,t,p,d:false,o:Date.now()}).catch(()=>alert('Kaydedilemedi: internet bağlantısını kontrol et'));
  tOpen[g+key]=true;renderNow();if(!quick){const c2=$('tc-'+pre);if(c2)c2.focus()}}
function taskClick(e){
  const ck=e.target.closest('[data-done]');if(ck){const [dk,key]=ck.dataset.done.split('|');toggleDone(dk,key,ck.getAttribute('aria-label')||'');return}
  const r=e.target.closest('[data-room]');if(r){openRoomPop(r.dataset.room,'info');return}
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.npop){const [g,key]=t.dataset.npop.split('|');return openNote(g,key)}
  if(t.dataset.tk) return toggleTask(t.dataset.tk);
  if(t.dataset.tview) return showPhoto(t.dataset.tview);
  if(t.dataset.ttoggle){const [g,key]=t.dataset.ttoggle.split('|');tOpen[g+key]=!isOpen(g,key);renderNow();return}
  if(t.dataset.taddopen){const pre=t.dataset.taddopen;tAdd[pre]=!tAdd[pre];renderNow();if(tAdd[pre]){const x=$('tc-'+pre);if(x&&!('ontouchstart' in window))x.focus()}return}
  if(t.dataset.tadd){const [g,key]=t.dataset.tadd.split('|');return addTask(g,key)}
  if(t.dataset.tsubopen){const i2=t.dataset.tsubopen.lastIndexOf('|'),pre=t.dataset.tsubopen.slice(0,i2),n=t.dataset.tsubopen.slice(i2+1);lOpen[pre]=lOpen[pre]===n?'':n;renderNow();return}
  if(t.dataset.tlsub){const [g,key,c,n]=t.dataset.tlsub.split('|');lOpen[g+'-'+key]='';return addTask(g,key,c,n)}
  if(t.dataset.nopen){const [g,key]=t.dataset.nopen.split('|');tOpen[g+key]=true;renderNow();const x=document.querySelector(`[data-note="${g}|${key}"]`);if(x){x.focus();try{x.setSelectionRange(x.value.length,x.value.length)}catch(_){}}return}
  if(t.dataset.tquick){const [g,key,n]=t.dataset.tquick.split('|');return addTask(g,key,n)}
  if(t.dataset.tdel){const [g,key,id]=t.dataset.tdel.split('|');const tk=clone(((tasks[g]||{})[key]||{})[id]);if(!tk)return;const path=`${ROOT}/tasks/${g}/${key}/${id}`;
    delPhotoLater(tk.p);db.ref(path).remove().catch(()=>{});renderNow();
    undoPush(`Görev silindi: ${tk.c||'Genel'}${tk.t?' – '+tk.t:''}`,()=>{keepPhoto(tk.p);db.ref(path).set(tk).catch(()=>{});tOpen[g+key]=true;renderNow()});return}
  if(t.dataset.tcat){const i2=t.dataset.tcat.lastIndexOf('|');const pre=t.dataset.tcat.slice(0,i2),c=t.dataset.tcat.slice(i2+1);const ci=$('tc-'+pre);if(ci){ci.value=c;const ti=$('tt-'+pre);if(ti)ti.focus()}}
}
function taskChange(e){const el=e.target;
  if(el.dataset.note){const [g,key]=el.dataset.note.split('|');saveNote(g,key,el.value);return}
  if(el.dataset.tphoto&&el.files&&el.files[0]){const pre=el.dataset.tphoto;fileToJpeg(el.files[0],900,.7).then(d=>{taskPhoto[pre]=d;renderNow()}).catch(()=>alert('Fotoğraf okunamadı'));return}if(el.dataset.tedit){const [g,key,id]=el.dataset.tedit.split('|');const v=el.value.trim();if(v)db.ref(`${ROOT}/tasks/${g}/${key}/${id}`).update({t:v})}}
function taskKey(e){if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('tt-')){e.preventDefault();const pre=e.target.id.slice(3),i2=pre.indexOf('-');addTask(pre.slice(0,i2),pre.slice(i2+1))}
  else if(e.key==='Enter'&&e.target.dataset.tedit){e.preventDefault();e.target.blur()}}
for(const id of ['days','wtasks']){$(id).addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.note){const [g,key]=el.dataset.note.split('|');saveNote(g,key,el.value)}});$(id).addEventListener('click',taskClick);$(id).addEventListener('change',taskChange);$(id).addEventListener('keydown',taskKey)}

const LOGO_KEYS={billa:'billa',billaplus:'billaplus',hofer:'hofer',lidl:'lidl',mega:'mega',megasupermarkt:'mega',metro:'metro',penny:'penny',pennymarkt:'penny',spar:'spar',tedi:'tedi',action:'action',dm:'dm',ikea:'ikea'};
const logoFor=n=>LOGOS[LOGO_KEYS[String(n||'').toLowerCase().replace(/[^a-zğüşıöç]/g,'')]]||null;
const DEF_STORES=['Billa','Billa Plus','Spar','Hofer','Lidl','Penny','Mega Supermarkt','Metro','Action','TEDi','dm','IKEA','Bipa','Libro','Pagro'];
let stores={}, shopStoreSel='', shopFilter=null, storeEdit=false, storeAdding=false;
let shopSort=(()=>{try{return localStorage.getItem('tmz-sort')||'added'}catch(e){return 'added'}})();
let shopMode=(()=>{try{return localStorage.getItem('tmz-smode')||'view'}catch(e){return 'view'}})();
let shopOpen=false; // alışveriş modu: açılınca sadece liste görünür
const storeList=()=>Object.entries(stores||{}).filter(([id,v])=>v&&v.n).map(([id,v])=>({id,...v})).sort((a,b)=>(a.o||0)-(b.o||0));
function badge(n,attr=''){if(!n)return '';const L=logoFor(n);return L?`<button class="sbadge" ${attr} aria-label="${esc(n)}"><img src="${L}" alt="${esc(n)}"></button>`:`<button class="sbadge txt" ${attr}>${esc(n)}</button>`}
function renderStorePick(){
  const S=storeList();
  let h=`<button class="schip txt${shopStoreSel===''?' on':''}" data-pick="">Fark etmez</button>`;
  h+=S.map(x=>{return `<button class="schip txt${shopStoreSel===x.n?' on':''}" data-pick="${esc(x.n)}" aria-label="${esc(x.n)}">${esc(x.n)}${storeEdit?`<span class="sx" data-sdelstore="${x.id}">✕</span>`:''}</button>`}).join('');
  h+=`<button class="schip add" data-sadd="1">+ Mağaza</button><button class="schip add" data-sedit="1">${storeEdit?'Bitti':'✎'}</button>`;
  if(storeAdding) h+=`<div class="snew" style="width:100%"><input id="newStore" placeholder="Mağaza adı, örn. Libro" maxlength="30" enterkeyhint="done"><button class="btn done" data-ssave="1">Ekle</button></div>`;
  $('storePick').innerHTML=h;
}
function renderShop(){
  {const n=Object.values(shop).filter(x=>x&&!x.d).length,c=$('cartN');c.textContent=n;c.hidden=!n}
  const el=$('shopList'); if(!el) return;
  $('shopSec').hidden=!db;
  $('shopSec').classList.toggle('closed',!shopOpen); $('shopBody').hidden=!shopOpen; $('shopToggle').setAttribute('aria-expanded',shopOpen);
  const ALL=Object.entries(shop||{}).filter(([id,v])=>v&&!shopExpired(v)).map(([id,v])=>({id,...v}));
  const openN=k=>ALL.filter(x=>!x.d&&(x.k||'food')===k).length;
  $('shopCnt').textContent=(openN('food')+openN('non'))||'';
  const sT=shopMode!=='view'&&shopType==='all'?'food':shopType; // eklerken bir tür seçili olmalı
  $('shopType').classList.toggle('two',shopMode!=='view');
  const tb=$('shopType').children; tb[0].textContent=`Gıda (${openN('food')})`; tb[1].textContent=`Gıda dışı (${openN('non')})`; tb[2].textContent=`Hepsi (${openN('food')+openN('non')})`;
  [...tb].forEach(b=>b.classList.toggle('on',b.dataset.st===sT));
  [...$('shopSort').children].forEach(b=>b.classList.toggle('on',b.dataset.so===shopSort));
  $('shopSec').classList.toggle('vmode',shopMode==='view');[...$('shopMode').children].forEach(b=>b.classList.toggle('on',b.dataset.sm===shopMode));
  if(!busyIn($('storePick'))) renderStorePick();
  let L=sT==='all'?ALL.slice():ALL.filter(x=>(x.k||'food')===sT);
  if(shopFilter!==null) L=L.filter(x=>(x.s||'')===shopFilter);
  const az=(a,b)=>String(a.t).localeCompare(String(b.t),'tr');
  const cmp=shopSort==='az'?az:shopSort==='store'?((a,b)=>((a.s?0:1)-(b.s?0:1))||String(a.s||'').localeCompare(String(b.s||''),'tr')||az(a,b)):((a,b)=>(a.o||0)-(b.o||0));
  const kOrd=x=>sT==='all'&&shopSort!=='store'?((x.k||'food')==='food'?0:1):0;
  L.sort((a,b)=>((a.d?1:0)-(b.d?1:0))||kOrd(a)-kOrd(b)||cmp(a,b));
  $('shopFilt').innerHTML=shopFilter!==null?`<div class="sfilt">Sadece: ${shopFilter?badge(shopFilter):'<b>Fark etmez</b>'}<button class="x" data-sfclear="1">✕ Filtreyi kaldır</button></div>`:'';
  const row=x=>`<div class="si${x.d?' ok':''}" data-sid="${x.id}"><button class="cb" data-sdone="${x.id}" aria-label="${esc(x.t)} alındı">✓</button><span class="st">${x.q&&x.q!=='1'?`<b class="sq">${esc(x.q)}${/^\d+$/.test(x.q)?'×':''}</b> `:''}${esc(x.t)}${x.p?` <button class="sph" data-sphoto="${x.p}" aria-label="Fotoğraf">📷</button>`:''}</span>${x.s&&shopSort!=='store'?badge(x.s,`data-sfilter="${esc(x.s)}"`):'<span></span>'}<button class="x" data-sdel="${x.id}" aria-label="Sil">✕</button></div>`;
  let h='';
  if(!L.length) h='<div class="hint" style="padding:8px 2px">Liste boş.</div>';
  else h='<div class="hint" style="padding:2px 2px 6px;font-size:.82rem">Düzenlemek için ürüne basılı tut. ✓ işaretlenenler 4 saat sonra kendiliğinden silinir.</div>';
  if(L.length&&shopSort==='store'){let last=null;for(const x of L){const g=x.d?'__done':(x.s||'');if(g!==last){last=g;h+=`<div class="sghead">${g==='__done'?'✓ Alınanlar':g?badge(g,`data-sfilter="${esc(g)}"`):'Fark etmez'}</div>`}h+=row(x)}}
  else if(L.length&&sT==='all'){let last=null;for(const x of L){const g=x.d?'__done':(x.k||'food');if(g!==last){last=g;h+=`<div class="sghead tp">${g==='__done'?'✓ Alınanlar':g==='food'?'🍎 Gıda':'🧴 Gıda dışı'}</div>`}h+=row(x)}}
  else if(L.length) h+=L.map(row).join('');
  const doneN=ALL.filter(x=>x.d).length;
  el.innerHTML=h+(doneN?`<button class="btn shop-clear" id="shopClear">Alınanları listeden sil (${doneN})</button>`:'');
}
function setShopMode(on){shopOpen=on;document.body.classList.toggle('shopmode',on);const b=$('cartBtn');b.classList.toggle('on',on);
  b.firstChild.nodeValue=on?'🧹 Temizlik':'🛒';b.setAttribute('aria-label',on?'Temizlik planına dön':'Alışveriş listesi');
  renderShop();window.scrollTo(0,0);if(!on)render()}
$('cartBtn').onclick=()=>setShopMode(!shopOpen);
/* ✓ işaretlenen ürünler 4 saat sonra kendiliğinden silinir */
const SHOP_TTL=4*3600*1000;
function shopExpired(x){return !!(x&&x.d&&x.dt&&Date.now()-x.dt>=4*3600*1000)}
function shopSweep(){if(!db)return;const now2=Date.now(),u={},fix={};
  for(const[id,x] of Object.entries(shop||{})){if(!x||!x.d)continue;
    if(!x.dt){fix[id+'/dt']=now2;continue}
    if(now2-x.dt>=SHOP_TTL){u[id]=null;if(x.p)db.ref(ROOT+'/photos/'+x.p).remove().catch(()=>{})}}
  if(Object.keys(fix).length)db.ref(ROOT+'/shop').update(fix).catch(()=>{});
  if(Object.keys(u).length)db.ref(ROOT+'/shop').update(u).catch(()=>{})}
setInterval(()=>{shopSweep();renderShop()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){shopSweep();renderShop()}});
$('shopToggle').onclick=()=>setShopMode(!shopOpen);
$('shopMode').onclick=e=>{const b=e.target.closest('[data-sm]');if(!b)return;shopMode=b.dataset.sm;try{localStorage.setItem('tmz-smode',shopMode)}catch(_){}renderShop()};
$('shopType').onclick=e=>{const b=e.target.closest('[data-st]');if(!b)return;shopType=b.dataset.st;try{localStorage.setItem('tmz-stype',shopType)}catch(_){}renderShop()};
$('shopSort').onclick=e=>{const b=e.target.closest('[data-so]');if(!b)return;shopSort=b.dataset.so;try{localStorage.setItem('tmz-sort',shopSort)}catch(_){}renderShop()};
$('storePick').onclick=async e=>{
  const del=e.target.closest('[data-sdelstore]');
  if(del){const sid=del.dataset.sdelstore,x=clone(stores[sid]);if(x&&confirm(x.n+' listeden silinsin mi?')){db.ref(ROOT+'/stores/'+sid).remove().catch(()=>{});if(shopStoreSel===x.n)shopStoreSel='';undoPush(`Mağaza silindi: ${x.n}`,()=>db.ref(ROOT+'/stores/'+sid).set(x).catch(()=>{}))}return}
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.pick!==undefined){if(storeEdit)return;shopStoreSel=t.dataset.pick;renderStorePick();return}
  if(t.dataset.sadd){storeAdding=!storeAdding;renderStorePick();if(storeAdding)$('newStore').focus();return}
  if(t.dataset.sedit){storeEdit=!storeEdit;renderStorePick();return}
  if(t.dataset.ssave) return saveStore();
};
async function saveStore(){const n=($('newStore').value||'').trim();if(!n)return;
  if(!storeList().some(x=>x.n.toLowerCase()===n.toLowerCase())) db.ref(ROOT+'/stores').push().set({n,o:Date.now()}).catch(()=>alert('Kaydedilemedi'));
  storeAdding=false;shopStoreSel=n;renderStorePick()}
$('storePick').addEventListener('keydown',e=>{if(e.target.id==='newStore'&&e.key==='Enter'){e.preventDefault();saveStore()}});
let shopPhoto=null;
$('shopPh').onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{shopPhoto=await fileToJpeg(f,900,.7);$('shopPhL').classList.add('has')}catch(_){alert('Fotoğraf okunamadı')}e.target.value=''};
async function addShop(){const t=$('shopTxt').value.trim();if(!t||!db){$('shopTxt').focus();return}
  const q=$('shopQty').value.trim()||'1';$('shopTxt').value='';$('shopQty').value='';

  const out=[0,1,2,3,4].map(i=>hol[i]?{rooms:[],vac:'',deep:false,[offOf(dayPlan(w,i))]:true}:{rooms:[],vac:'',deep:false});

function swapDays(a,b){

  const wb=ida===idb?wa:JSON.parse(JSON.stringify(weeks[idb]||{days:[]}));
  for(const w of [wa,wb]) for(let j=0;j<5;j++) w.days[j]=w.days[j]||{rooms:[],vac:'',deep:false};
  const olds={[ida]:clone(weeks[ida]),[idb]:clone(weeks[idb])};
  const A=wa.days[a.d], B=wb.days[b.d];
  if(ovMode==='vac'){const v=A.vac||'';A.vac=B.vac||'';B.vac=v} // sadece süpürge

    if(br.includes(k)){setStatus(`${roomBy[k].n} o günde zaten var`);return}

    if(A.deep&&!A.rooms.length){A.deep=false;B.deep=true}
    weeks[ida]=wa; weeks[idb]=wb; dirty.add(ida); dirty.add(idb);
    render(); queueSave(ida); if(idb!==ida) queueSave(idb);
    setStatus(`${roomBy[k].n}: ${a.w}. hafta ${DN[a.d]} → ${b.w}. hafta ${DN[b.d]}`); undoPush(`${roomBy[k].n} taşındı: ${a.w}. hafta ${DN[a.d]} → ${b.w}. hafta ${DN[b.d]}`,()=>restoreWeeks(olds)); return;
  }
  else{const ar=A.rooms||[], ad=!!A.deep; A.rooms=B.rooms||[]; A.deep=!!B.deep; B.rooms=ar; B.deep=ad; const ah=!!A.hol; A.hol=!!B.hol; B.hol=ah; const as=!!A.sick; A.sick=!!B.sick; B.sick=as} // süpürge yerinde kalır

      const nb=ROOMS.filter(r=>!r.b);if(nb.length&&s.val()){const u={};nb.forEach(r=>u[r.k+'/b']=keyOf(addDays(now,-99)));rdb.ref(ROOT+'/rooms').update(u).catch(()=>{})}

    rdb.ref(ROOT+'/info').on('value',s=>{info=s.val()||{};renderStats();if(!popRoom||popTab!=='info')return;const sig=infoSig(popRoom);if(popEdit&&sig===lastSig)return;lastSig=sig;safeR($('roomPop'),'pop',()=>{if(popRoom)renderPop()})});
    rdb.ref(ROOT+'/tasks').on('value',s=>{const v=s.val()||{};tasks={day:v.day||{},week:v.week||{}};render()});
    rdb.ref(ROOT+'/done').on('value',s=>{doneMap=s.val()||{};render();renderStats()});
    rdb.ref(ROOT+'/notes').on('value',s=>{const v=s.val()||{};notes={day:v.day||{},week:v.week||{}};render();if(noteCtx&&!noteEditing)renderNotePop()});
    rdb.ref(ROOT+'/shop').on('value',s=>{shop=s.val()||{};renderShop();shopSweep()});
    {const fs=await rdb.ref(ROOT+'/stores').once('value');if(!fs.exists()){const u={};DEF_STORES.forEach((n,i)=>u['s'+i]={n,o:i});await rdb.ref(ROOT+'/stores').set(u)}}
    {const f2=await rdb.ref(ROOT+'/config/st2').once('value');if(!f2.exists()){const cur=(await rdb.ref(ROOT+'/stores').once('value')).val()||{};
      if(!Object.values(cur).some(x=>x&&String(x.n).toLowerCase()==='ikea'))await rdb.ref(ROOT+'/stores').push().set({n:'IKEA',o:9.5});await rdb.ref(ROOT+'/config/st2').set(true)}}
    rdb.ref(ROOT+'/stores').on('value',s=>{stores=s.val()||{};renderShop()});
    rdb.ref(ROOT+'/config').on('value',s=>{const v=s.val();if(v){cfg={cycle:16,...v};const st=startMon();if(st&&monday<st)monday=homeMonday()} render()});
    rdb.ref(ROOT+'/weeks').on('value',s=>{
      const next=s.val()||{};
      for(const id of dirty) next[id]=weeks[id];
      weeks=next; loaded=true; render();
    },()=>{loaded=true;render()});
  }catch(e){console.error(e);db=null;loaded=true;loadErr=(authErr?'Giriş: '+(authErr.code||authErr.message)+' · ':'')+(e.code||e.message);render()}
}

if(appOk()) startApp(); else {$('lock').hidden=false;setTimeout(()=>$('lockIn').focus(),100)}
